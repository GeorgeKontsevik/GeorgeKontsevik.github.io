{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Apply the saved theme before the browser paints the new page.
  (function () {
    var theme;
    try { theme = localStorage.getItem('theme'); } catch (error) {}
    var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  }());
</script>

<style>
  html { background: var(--global-bg-color, #fff); color-scheme: light; }
  html[data-theme="dark"] { background: var(--global-bg-color, #474747); color-scheme: dark; }
</style>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">
<script defer src="{{ base_path }}/assets/js/navigation.js?v={{ site.time | date: '%s' }}"></script>
