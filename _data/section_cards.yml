talks:
  - title: "ICCSA 2024 — Optimal Service Placement"
    image: "/images/publications/service-placement-time-difference.png"
    image_alt: "Map of connections coloured by travel-time difference in minutes"
    description: >-
      **Enhancing Urban Planning Through Improved Connectivity: A Genetic Algorithm Approach for Optimal Service Placement.**
      Georgii Kontsevik, Valeria Tikhevich and Sergey Mityagin.
      [Publication](https://doi.org/10.1007/978-3-031-64605-8_27) ·
      [Paper details](/publication/enhancing-urban-planning-through-improved-connectivity-a-genetic-algorithm-approach-for-optimal-service-placement/) ·
      [Code](https://github.com/ValeriyaTikhevich/solver_FLP).
  - title: "ICCSA 2023 — Spatial Inequality in Agglomeration Planning"
    image: "/images/talks/iccsa-2023-presentation.png"
    image_alt: "George Kontsevik presenting spatial inequality research at ICCSA 2023"
    description: >-
      **Assessment of Spatial Inequality in Agglomeration Planning.**
      Georgii Kontsevik, Igor Lavrov, Aleksandr Morozov, Leonid Kharlov and Sergey Mityagin.
      [Publication](https://doi.org/10.1007/978-3-031-36808-0_17) ·
      [Paper details](/publication/assessment-of-spatial-inequality-in-agglomeration-planning/).
      <a href="/images/talks/iccsa-2023-banner.png"><img src="/images/talks/iccsa-2023-banner.png" alt="George Kontsevik beside the ICCSA 2023 conference banner in Athens" loading="lazy" style="max-height: 360px; width: auto;"></a>
  - title: "Sber AI R&D Day 2025 — Poster Session"
    image: "/images/talks/sber-ai-rd-day-poster.png"
    image_alt: "George Kontsevik presenting a poster on graph clustering for transport pathfinding at Sber AI R&D Day 2025"
    description: >-
      Poster presentation on accelerating transport pathfinding through graph clustering.
      Related paper: [Assessing the complexity of a path search optimization method based on clustering for a transport graph](https://doi.org/10.1140/epjds/s13688-025-00542-0), EPJ Data Science.
      [RIDE code](https://github.com/sb-ai-lab/Ride).
  - title: "Segregated by Design — AMS 2026"
    image: "/images/talks/ams-2026.png"
    image_alt: "Presentation at AMS 2026 showing urban blocks and street-pattern classification"
    description: >-
      [Presentation post](https://www.linkedin.com/feed/update/urn:li:activity:7432402798253879296/).
  - title: "AAAI 2026 — AI for Urban Planning Workshop"
    image: "/images/talks/aaai-2026-workshop.png"
    image_alt: "George Kontsevik with the Spatial-Morphological Modeling for Multi-Attribute Imputation of Urban Blocks poster at AAAI 2026"
    description: >-
      [Workshop post](https://www.linkedin.com/feed/update/urn:li:activity:7425998648720674816/).
      Related works: [One Rule to Bring Them All](https://arxiv.org/abs/2602.15053)
      and [Spatial-Morphological Modeling for Multi-Attribute Imputation of Urban Blocks](https://arxiv.org/abs/2602.10923).
  - title: "NetSci — multimodal transport routes and urban morphology"
    image: "/images/talks/netsci-poster-acceptance.png"
    image_alt: "NetSci 2026 poster acceptance for Computational Framework for Sustainable Transport Planning on Street Networks"
    description: >-
      Yana Zorina's poster accepted under joint supervision.
      [Post about the student's work](https://www.linkedin.com/feed/update/urn:li:activity:7429469726227210240/).
teaching:
  - title: "Spatial analysis for urban planning"
    image: "/images/teaching/spatial-analysis-class.png"
    image_alt: "George Kontsevik teaching at a whiteboard with Python and data imputation examples"
    description: >-
      I developed and taught three cohorts of a master's-level course on spatial analysis in English for urban planning students.
      The course covered raw data processing, spatial analysis, and modeling from the ground up.
      [Urban Data Science course post](https://www.linkedin.com/feed/update/urn:li:activity:7253813029811765248/).
teaching_assistantships:
  - title: "Spatial Analysis in Python — Inessa Tregubova"
    image: ""
    image_alt: ""
    description: >-
      Teaching assistant: practical sessions, student support and homework review
      for Inessa Tregubova's Russian-language spatial analysis course.
      My #1 recommendation for learning spatial analysis in Russian.
      [Course website](https://geopython.su/).
student_supervision:
  - title: "Yana Zorina — NetSci 2026 poster acceptance"
    image: "/images/talks/netsci-poster-acceptance.png"
    image_alt: "NetSci 2026 poster acceptance for Computational Framework for Sustainable Transport Planning on Street Networks"
    description: >-
      Joint supervision with Liubov Tupikina of undergraduate student Yana Zorina.
      Her work develops a framework for multimodal transport route modelling
      that incorporates urban morphology into routing and mode choice.
      **Achievement:** abstract accepted for a poster session at NetSci 2026,
      “Computational Framework for Sustainable Transport Planning on Street Networks”.
      [Acceptance announcement](https://www.linkedin.com/feed/update/urn:li:activity:7429469726227210240/).
  - title: "Abubakar Ndaman — Kazan OIC Youth Scientific Congress"
    image: ""
    image_alt: ""
    description: >-
      Research supervised by George Kontsevik.
      **Achievement:** accepted to present at the Kazan OIC Youth Scientific Congress.
      [About the congress](https://kazan.oicyouthcapital.com/tpost/8fgp3sc3t1-oic-youth-scientific-congress).
  - title: "Alina Gubina — Arctic transport networks"
    image: "/images/projects/arctic-network-scheme.png"
    image_alt: "Environment-framed Arctic transport network model"
    description: >-
      Research supervised by George Kontsevik.
      **Achievement:** co-authored “Environment-framed networks: seasonal reconfiguration
      of service accessibility in Arctic transport systems”, published in Applied Network Science (2026).
      [Read the paper](https://doi.org/10.1007/s41109-026-00783-6).
  - title: "Valeria Tikhevich — publications and research award"
    image: "/images/publications/service-placement-time-difference.png"
    image_alt: "Map of connections coloured by travel-time difference in minutes"
    description: >-
      Master's student research supervised by George Kontsevik.
      **Publications:** co-authored the [Arctic transport networks paper](https://doi.org/10.1007/s41109-026-00783-6)
      in Applied Network Science (2026), and
      [“Enhancing Urban Planning Through Improved Connectivity: A Genetic Algorithm Approach for Optimal Service Placement”](https://doi.org/10.1007/978-3-031-64605-8_27)
      at ICCSA 2024.
      [Service placement code — solver_FLP](https://github.com/ValeriyaTikhevich/solver_FLP).
      **Award:** winner of the student research grant competition administered by
      the Saint Petersburg Committee for Science and Higher Education (KNVSh),
      receiving a RUB 50,000 award (approximately USD 500).
      [Winners list, p. 9, entry 89](https://www.spbume.ru/file/news/7660/P2.pdf#page=9).
