talks:
  - title: "Sber AI R&D Day — Poster Session"
    image: "/images/talks/sber-ai-rd-day-poster.png"
    image_alt: "George Kontsevik presenting a poster on graph clustering for transport pathfinding at Sber AI R&D Day"
    description: >-
      Poster presentation on accelerating transport pathfinding through graph clustering.
      Related paper: [Assessing the complexity of a path search optimization method based on clustering for a transport graph](https://doi.org/10.1140/epjds/s13688-025-00542-0), EPJ Data Science.
      [RIDE code](https://github.com/sb-ai-lab/Ride).
  - title: "Segregated by Design — AMS 2026"
    image: "/images/talks/ams-2026.png"
    image_alt: "Presentation at AMS 2026 showing urban blocks and street-pattern classification"
    description: >-
      [Presentation post](https://www.linkedin.com/feed/update/urn:li:activity:7432402798253879296/).
  - title: "AAAI 2026 — AI for Urban Planning Workshop"
    image: "/images/talks/aaai-2026-workshop.png"
    image_alt: "George Kontsevik with the Spatial-Morphological Modeling for Multi-Attribute Imputation of Urban Blocks poster at AAAI 2026"
    description: >-
      [Workshop post](https://www.linkedin.com/feed/update/urn:li:activity:7425998648720674816/).
      Related works: [One Rule to Bring Them All](https://arxiv.org/abs/2602.15053)
      and [Spatial-Morphological Modeling for Multi-Attribute Imputation of Urban Blocks](https://arxiv.org/abs/2602.10923).
  - title: "NetSci — multimodal transport routes and urban morphology"
    image: "/images/talks/netsci-poster-acceptance.jpg"
    image_alt: "NetSci 2026 poster acceptance for Computational Framework for Sustainable Transport Planning on Street Networks"
    description: >-
      Yana Zorina's poster accepted under joint supervision.
      [Post about the student's work](https://www.linkedin.com/feed/update/urn:li:activity:7429469726227210240/).
teaching:
  - title: "Spatial analysis for urban planning"
    image: "/images/teaching/spatial-analysis-class.png"
    image_alt: "George Kontsevik teaching at a whiteboard with Python and data imputation examples"
    description: >-
      I developed and taught three cohorts of a master's-level course on spatial analysis in English for urban planning students.
      The course covered raw data processing, spatial analysis, and modeling from the ground up.
      [Urban Data Science course post](https://www.linkedin.com/feed/update/urn:li:activity:7253813029811765248/).
teaching_assistantships:
  - title: "Spatial Analysis in Python — Inessa Tregubova"
    image: ""
    image_alt: ""
    description: >-
      Teaching assistant: practical sessions, student support and homework review
      for Inessa Tregubova's Russian-language spatial analysis course.
      My #1 recommendation for learning spatial analysis in Russian.
      [Course website](https://geopython.su/).
student_supervision:
  - title: "Yana Zorina — NetSci 2026 poster acceptance"
    image: "/images/talks/netsci-poster-acceptance.jpg"
    image_alt: "NetSci 2026 poster acceptance for Computational Framework for Sustainable Transport Planning on Street Networks"
    description: >-
      Joint supervision with Liubov Tupikina of undergraduate student Yana Zorina.
      Her work develops a framework for multimodal transport route modelling
      that incorporates urban morphology into routing and mode choice.
      **Achievement:** abstract accepted for a poster session at NetSci 2026,
      “Computational Framework for Sustainable Transport Planning on Street Networks”.
      [Acceptance announcement](https://www.linkedin.com/feed/update/urn:li:activity:7429469726227210240/).
