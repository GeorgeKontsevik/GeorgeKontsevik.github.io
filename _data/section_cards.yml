teaching:
  - title: "Courses taught"
    image: "/images/teaching/spatial-analysis-class.png"
    image_alt: "George Kontsevik teaching at a whiteboard with Python and data imputation examples"
    description: >-
      **Spatial Analysis for Urban Planning**
      — developed and taught three cohorts of a master's-level course in English for urban planning students.
      The course covered raw-data processing, spatial analysis, and modelling from the ground up.

      **Urban Data Science — Autumn 2025**
      — applied urban analytics, including OpenStreetMap, network metrics, Python analysis,
      reproducible workflows, and city-planning simulation.

      **Python Programming Language for Urban Studies — Spring 2025**
      — practical Python methods and urban-analysis tools tailored to student research.

      **Student feedback — Urban Data Science, Autumn 2025**
      All 3 respondents rated both teaching satisfaction and professional usefulness 5/5.
      “The practical orientation of the course and exposure to modern tools and methods used in urban analytics
      helped bridge theory with hands-on implementation.”

      **Student feedback — Python Programming Language for Urban Studies, Spring 2025**
      All 3 respondents rated both teaching satisfaction and professional usefulness 5/5.
      “The interactive approach to addressing challenges faced by students was especially effective for such a practical subject.”
      Another student noted the focus on urban-analysis tools and techniques tailored to individual research.
